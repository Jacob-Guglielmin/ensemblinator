[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ensemblinator"
version = "0.1.0"
description = "Job orchestrator with builtin notifications"
requires-python = ">=3.12"
dependencies = [
    "apscheduler",
    "flask",
    "gunicorn",
    "requests"
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[project.scripts]
ensemblinator = "ensemblinator.main:main"
ensemblinator-tools = "ensemblinator.cli.dispatch:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
